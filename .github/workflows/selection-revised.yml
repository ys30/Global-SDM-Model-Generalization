name: Revised region selection
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/33_selection_revised.R'
      - '.github/workflows/selection-revised.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          name: pa-revised
          path: inputs
          run-id: 45932827620
          github-token: ${{ github.token }}
      - run: Rscript scripts/33_selection_revised.R
      - uses: actions/upload-artifact@v4
        with:
          name: selection-revised
          path: results/selection_revised/
