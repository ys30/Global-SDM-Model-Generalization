name: Revised independent PO benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/34_po_revised.R'
      - '.github/workflows/po-revised.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region: [AWT, CAN, NSW, NZ, SA, SWI]
    env:
      TARGET_REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - run: |
          git clone https://github.com/rspatial/disdat.git /tmp/disdat
          git -C /tmp/disdat checkout 71b878e85ea02764386cfcdbff97816a8f18a8df
          R CMD INSTALL /tmp/disdat
          Rscript -e 'install.packages(c("maxnet","glmnet","xgboost"))'
      - run: Rscript scripts/34_po_revised.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: po-revised-${{ matrix.region }}
          path: results/po_revised/
