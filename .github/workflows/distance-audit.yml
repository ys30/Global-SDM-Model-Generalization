name: Spatial distance and buffer audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/distance-audit.yml'
      - 'scripts/14_distance_audit.R'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev
          git clone https://github.com/rspatial/disdat.git /tmp/disdat
          git -C /tmp/disdat checkout 71b878e85ea02764386cfcdbff97816a8f18a8df
          R CMD INSTALL /tmp/disdat
          Rscript -e 'install.packages(c("sf","RANN"))'
      - run: Rscript scripts/14_distance_audit.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distance-audit
          path: results/distance/
