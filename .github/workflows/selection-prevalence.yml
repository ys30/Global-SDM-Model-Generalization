name: Prevalence model selection
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/37_selection_prevalence.R'
      - '.github/workflows/selection-prevalence.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          name: pa-revised
          path: inputs
          run-id: 45932827620
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: pa-ridge-replay-*
          path: inputs/replay
          run-id: 45891430344
          github-token: ${{ github.token }}
      - run: Rscript scripts/37_selection_prevalence.R
      - uses: actions/upload-artifact@v4
        with:
          name: selection-prevalence
          path: results/selection_prevalence/
