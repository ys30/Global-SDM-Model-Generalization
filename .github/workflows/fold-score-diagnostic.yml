name: Within-fold score diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fold-score-diagnostic.yml'
      - 'scripts/09_fold_score_diagnostic.R'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          name: oof-pooling
          run-id: 45707940497
          github-token: ${{ github.token }}
          path: results/oof
      - name: Verify recovered inputs
        run: |
          test -s results/oof/predictions.csv.gz
          test -s results/oof/glm_fold_metrics.csv
          gzip -t results/oof/predictions.csv.gz
          sha256sum results/oof/predictions.csv.gz results/oof/glm_fold_metrics.csv
      - run: Rscript scripts/09_fold_score_diagnostic.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fold-score-diagnostic
          path: |
            results/oof/within_fold_auc.csv
            results/oof/rank_diagnostic.csv
