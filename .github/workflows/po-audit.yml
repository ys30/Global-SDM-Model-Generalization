name: Presence-only data audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/11_po_audit.R'
      - '.github/workflows/po-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - run: |
          git clone https://github.com/rspatial/disdat.git /tmp/disdat
          git -C /tmp/disdat checkout 71b878e85ea02764386cfcdbff97816a8f18a8df
          R CMD INSTALL /tmp/disdat
      - run: Rscript scripts/11_po_audit.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: po-audit
          path: results/po_audit/
