name: Hierarchical slope paired summary
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/44_hierarchical_summary.R'
      - '.github/workflows/hierarchical-summary.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: hierarchical-slopes-*
          path: inputs
          run-id: 46168980084
          github-token: ${{ github.token }}
      - run: Rscript scripts/44_hierarchical_summary.R
      - uses: actions/upload-artifact@v4
        with:
          name: hierarchical-summary
          path: results/hierarchical_summary/
