name: PO ridge anomaly audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/23_po_ridge_audit.R'
      - '.github/workflows/po-ridge-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - run: |
          git clone https://github.com/rspatial/disdat.git /tmp/disdat
          git -C /tmp/disdat checkout 71b878e85ea02764386cfcdbff97816a8f18a8df
          R CMD INSTALL /tmp/disdat
          Rscript -e 'install.packages(c("maxnet","glmnet","xgboost"))'
      - uses: actions/download-artifact@v4
        with:
          name: po-models
          path: inputs
          run-id: 45754770473
          github-token: ${{ github.token }}
      - run: Rscript scripts/23_po_ridge_audit.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: po-ridge-audit
          path: results/po_ridge_audit/
