name: MaxEnt factorial paired summary
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/42_maxnet_summary.R'
      - '.github/workflows/maxnet-summary.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: maxnet-sensitivity-*
          path: inputs
          run-id: 46117484994
          github-token: ${{ github.token }}
      - run: Rscript scripts/42_maxnet_summary.R
      - uses: actions/upload-artifact@v4
        with:
          name: maxnet-summary
          path: results/maxnet_summary/
