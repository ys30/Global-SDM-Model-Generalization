name: M01-M02 data audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/01_audit.R'
      - 'scripts/02_eda.R'
      - 'scripts/03_glm_pilot.R'
      - '.github/workflows/data-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - name: Install pinned data package
        run: |
          git clone https://github.com/rspatial/disdat.git /tmp/disdat
          git -C /tmp/disdat checkout 71b878e85ea02764386cfcdbff97816a8f18a8df
          R CMD INSTALL /tmp/disdat
      - run: Rscript scripts/01_audit.R
      - name: Print inventory summary
        run: cat results/audit/region_counts.csv
      - run: Rscript scripts/02_eda.R
      - run: Rscript scripts/03_glm_pilot.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glm-pilot
          path: results/pilot/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m03-eda
          path: results/eda/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m01-m02-audit
          path: results/audit/
