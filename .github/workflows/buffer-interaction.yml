name: Paired buffer interaction
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/22_buffer_interaction.R'
      - '.github/workflows/buffer-interaction.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          name: buffer-control
          path: inputs
          run-id: 45764078601
          github-token: ${{ github.token }}
      - run: Rscript scripts/22_buffer_interaction.R
      - uses: actions/upload-artifact@v4
        with:
          name: buffer-interaction
          path: results/interaction/
