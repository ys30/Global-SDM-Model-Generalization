name: Aggregate full nested tuning
on:
  workflow_run:
    workflows: ["Full nested spatial tuning"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  aggregate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: nested-full-*
          path: inputs
          run-id: ${{ github.event.workflow_run.id || '45759653162' }}
          github-token: ${{ github.token }}
      - run: Rscript scripts/18_nested_aggregate.R
      - uses: actions/upload-artifact@v4
        with:
          name: nested-combined
          path: results/nested_combined/
