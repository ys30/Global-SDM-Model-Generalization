name: Novelty model selection
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/46_selection_novelty.R'
      - '.github/workflows/selection-novelty.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          name: pa-revised
          path: inputs/pa
          run-id: 45932827620
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: novelty-*
          path: inputs/novelty
          run-id: 46173862299
          github-token: ${{ github.token }}
      - run: Rscript scripts/46_selection_novelty.R
      - uses: actions/upload-artifact@v4
        with:
          name: selection-novelty
          path: results/selection_novelty/
