name: Selector variant paired audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/39_selection_variants.R'
      - '.github/workflows/selection-variants.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          name: selection-prevalence
          path: inputs
          run-id: 46085788518
          github-token: ${{ github.token }}
      - run: Rscript scripts/39_selection_variants.R
      - uses: actions/upload-artifact@v4
        with:
          name: selection-variants
          path: results/selection_variants/
