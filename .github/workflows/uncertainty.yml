name: Paired uncertainty analysis
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/21_uncertainty.R'
      - '.github/workflows/uncertainty.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: corrected-shard-*
          path: inputs/pa
          run-id: 45854228239
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: nested-combined
          path: inputs/nested
          run-id: 45854203614
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: buffer-control
          path: inputs/buffer
          run-id: 45764078601
          github-token: ${{ github.token }}
      - run: Rscript scripts/21_uncertainty.R
      - uses: actions/upload-artifact@v4
        with:
          name: paired-uncertainty
          path: results/uncertainty/
