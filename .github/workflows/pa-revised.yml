name: Revised PA benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/32_pa_revised.R'
      - '.github/workflows/pa-revised.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: corrected-shard-*
          path: inputs/pa
          run-id: 45854228239
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: pa-ridge-replay-*
          path: inputs/replay
          run-id: 45891430344
          github-token: ${{ github.token }}
      - run: Rscript scripts/32_pa_revised.R
      - uses: actions/upload-artifact@v4
        with:
          name: pa-revised
          path: results/pa_revised/
