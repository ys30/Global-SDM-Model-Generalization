name: Revised PO paired summary
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/35_po_summary.R'
      - '.github/workflows/po-summary.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: po-revised-*
          path: inputs/new
          run-id: 45951414868
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: po-models
          path: inputs/old
          run-id: 45754770473
          github-token: ${{ github.token }}
      - run: Rscript scripts/35_po_summary.R
      - uses: actions/upload-artifact@v4
        with:
          name: po-summary
          path: results/po_summary/
