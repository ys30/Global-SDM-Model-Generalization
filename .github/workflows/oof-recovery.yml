name: Recover OOF summaries without retraining
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oof-recovery.yml'
      - 'scripts/08_oof_summary.R'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/download-artifact@v4
        with:
          name: oof-pooling
          run-id: 45707940497
          github-token: ${{ github.token }}
          path: results/oof
      - name: Verify recovered inputs
        run: |
          test -s results/oof/predictions.csv.gz
          test -s results/oof/glm_fold_metrics.csv
          gzip -t results/oof/predictions.csv.gz
          sha256sum results/oof/predictions.csv.gz results/oof/glm_fold_metrics.csv
      - run: Rscript scripts/08_oof_summary.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-oof-summary
          path: |
            results/oof/pooling.csv
            results/oof/matched_scheme.csv
