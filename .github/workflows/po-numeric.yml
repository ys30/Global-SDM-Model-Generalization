name: PO ridge numerical audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/25_po_numeric.R'
      - '.github/workflows/po-numeric.yml'
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - run: |
          git clone https://github.com/rspatial/disdat.git /tmp/disdat
          git -C /tmp/disdat checkout 71b878e85ea02764386cfcdbff97816a8f18a8df
          R CMD INSTALL /tmp/disdat
          Rscript -e 'install.packages(c("maxnet","glmnet","xgboost"))'
      - run: Rscript scripts/25_po_numeric.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: po-numeric
          path: results/po_numeric/
