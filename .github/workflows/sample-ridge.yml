name: Controlled sample size and ridge pilot
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/05_sample_ridge.R'
      - '.github/workflows/sample-ridge.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - name: Install dependencies
        run: |
          git clone https://github.com/rspatial/disdat.git /tmp/disdat
          git -C /tmp/disdat checkout 71b878e85ea02764386cfcdbff97816a8f18a8df
          R CMD INSTALL /tmp/disdat
          Rscript -e 'install.packages("glmnet")'
      - run: Rscript scripts/05_sample_ridge.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-ridge
          path: results/ridge/
